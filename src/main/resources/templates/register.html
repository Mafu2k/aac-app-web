<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rejestracja – AAC APP</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dark-mode.css" />
  <link rel="stylesheet" href="/css/accessibility.css" />
  <link rel="stylesheet" href="/css/accessibility-panel.css" />
</head>
<body>
<a href="#main" class="skip-link">Pomiń nawigację</a>
<header class="topbar" role="banner">
  <nav class="nav" aria-label="Główna nawigacja">
    <a class="nav__brand" href="/">AAC APP</a>
    <div class="nav__links">
      <a class="nav__link" href="/board">Tablica</a>
      <a class="nav__link" href="/settings">Ustawienia</a>
      <a class="nav__link" href="/login">Zaloguj</a>
      <a class="nav__link" href="/register" aria-current="page">Rejestracja</a>
    </div>
  </nav>
</header>
<main id="main" role="main" class="dashboard">
<div class="card card--large">
  <h1>Rejestracja</h1>
  <form id="form" class="form">
    <div class="form__row">
      <label for="username" class="label">Login</label>
      <input id="username" name="username" class="input" minlength="3" maxlength="50" required autofocus />
    </div>

    <div class="form__row">
      <label for="email" class="label">E-mail</label>
      <input id="email" name="email" type="email" class="input" required />
    </div>

    <div class="form__row">
      <label for="password" class="label">Hasło (min 6 znaków)</label>
      <input id="password" name="password" type="password" class="input" minlength="6" required />
    </div>

    <div class="form__row">
      <label for="displayName" class="label">Wyświetlana nazwa (opcjonalnie)</label>
      <input id="displayName" name="displayName" class="input" />
    </div>

    <button type="submit" class="btn btn--large">Utwórz konto</button>
  </form>
  <div id="msg" role="status" aria-live="polite" class="note"></div>
  <div class="actions">
    <a class="link" href="/login">Masz już konto? Zaloguj się</a>
    <a class="link" href="/">Wróć do strony głównej</a>
  </div>
</div>
</main>
<script>
  function nextPath(){
    const p = new URLSearchParams(location.search).get('next');
    if(p && p.startsWith('/')) return p;
    return '/'; // Powrót do strony głównej z 6 kafelkami
  }
  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const displayName = document.getElementById('displayName').value.trim();
    const msg = document.getElementById('msg');
    msg.className = '';
    msg.textContent = '';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, displayName })
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || 'Błąd rejestracji');
      }
      const data = await res.json();
      if (data && data.token) {
        localStorage.setItem('aac_jwt', data.token);
        msg.className = 'ok';
        msg.textContent = 'Konto utworzone i zalogowano. Przenoszę do tablicy...';
        setTimeout(() => window.location.href = nextPath(), 300);
      } else {
        throw new Error('Nieprawidłowa odpowiedź serwera');
      }
    } catch (err) {
      msg.className = 'error';
      msg.textContent = err.message || 'Wystąpił błąd';
    }
  });
</script>
<script src="/js/app.js"></script>
<script src="/js/accessibility-panel.js"></script>
</body>
</html>
