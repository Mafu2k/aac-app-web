<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rywalizacja</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="stylesheet" href="/css/dark-mode.css"/>
  <link rel="stylesheet" href="/css/accessibility.css"/>
</head>
<body>
<a href="#main" class="skip-link">Pomiń nawigację</a>
<header class="topbar" role="banner">
  <nav class="nav" aria-label="Główna nawigacja">
    <a class="nav__brand" href="/">AAC APP</a>
    <div class="nav__links">
      <a class="nav__link" href="/board">Tablica</a>
      <a class="nav__link" href="/therapist">Terapeuta</a>
      <a class="nav__link" href="/education">Edukacja</a>
      <a class="nav__link" href="/competition" aria-current="page">Rywalizacja</a>
      <a class="nav__link" href="/community">Społeczność</a>
      <a class="nav__link" href="/settings">Ustawienia</a>
      <a class="nav__link" href="/help">Pomoc</a>
      <button id="logoutBtn" class="btn btn--ghost" aria-label="Wyloguj">Wyloguj</button>
    </div>
  </nav>
</header>

<main id="main" class="container" role="main">
  <section class="panel">
    <div class="panel__header">
      <h1 class="panel__title">Tryb rywalizacji</h1>
    </div>
    <div class="grid grid--2">
      <div>
        <h2>Wyzwania</h2>
        <div class="cards">
          <button class="card btn" data-points="10">Szybkie zdanie (10 XP)</button>
          <button class="card btn" data-points="25">3 zdania z emocją (25 XP)</button>
          <button class="card btn" data-points="50">Historia dnia (50 XP)</button>
        </div>
        <div class="form__row">
          <label class="label" for="customPoints">Własne punkty</label>
          <input id="customPoints" type="number" class="input" min="1" max="200" step="1"/>
          <button id="customSubmit" class="btn">Dodaj XP</button>
        </div>
        <div id="submitStatus" aria-live="polite"></div>
      </div>
      <div>
        <h2>Ranking</h2>
        <ol id="leaderboard" class="leaderboard" aria-live="polite"></ol>
      </div>
    </div>
  </section>
</main>

<script src="/js/app.js"></script>
<script src="/js/tts.js"></script>
<script src="/js/competition.js"></script>
<script src="/js/voice-control.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', logout);
</script>
</body>
</html>
