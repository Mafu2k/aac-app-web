spring.application.name=aac-app-web

# Default DB: H2 (file) for local development
spring.datasource.url=jdbc:h2:file:./data/aac_app;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uncomment and set to use MySQL in production
# spring.datasource.url=jdbc:mysql://localhost:3306/aac_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=your_mysql_user
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security - CHANGE THIS SECRET IN PRODUCTION!
app.security.jwt.secret=${AAC_APP_JWT_SECRET:CHANGE-THIS-SECRET-IN-PRODUCTION-USE-STRONG-KEY}
app.security.jwt.expiration-seconds=86400

# CORS
app.cors.allowed-origins=${AAC_APP_CORS_ORIGINS:http://localhost:8080}

# Swagger
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui

# Mail configuration (opcjonalne - dla funkcji SOS przez email)
# Skonfiguruj serwer SMTP aby wysyłać emaile SOS
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
