spring.application.name=aac-app-web

spring.datasource.url=jdbc:h2:file:./data/aac_app;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.jwt.secret=${AAC_APP_JWT_SECRET:CHANGE-THIS-SECRET-IN-PRODUCTION-USE-STRONG-KEY}
app.security.jwt.expiration-seconds=86400

app.cors.allowed-origins=${AAC_APP_CORS_ORIGINS:http://localhost:8080}

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
